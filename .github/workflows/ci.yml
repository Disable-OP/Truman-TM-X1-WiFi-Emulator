# Quality gates on every push and PR (docs/roadmap.md, Milestone M):
# the same gates the repo enforces locally — cargo fmt --check,
# clippy with all targets/features at 0 warnings, and the full test
# suite in release mode (the boot tests are deterministic; release
# keeps the ~10 s wall clock).

name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/index
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
      - name: Format
        run: cargo fmt --check
      - name: Clippy (all targets, all features, 0 warnings)
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Tests (release)
        run: cargo test --release
      - name: Check (all targets)
        run: cargo check --all-targets
